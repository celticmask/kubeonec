# Default values for kubeonec.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: localhost/onec-server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 8.3.18.1363

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

## Default Cluster manager service
service:
  type: ClusterIP
  port: 1541
  ## The node port (only relevant for type LoadBalancer or NodePort)
  nodePort:
  ## The cluster ip address (only relevant for type LoadBalancer or NodePort)
  clusterIP:
  ## The loadbalancer ip address (only relevant for type LoadBalancer)
  loadBalancerIP:
  # Annotations to add to the service
  annotations: {}

# Additional services per pod
ports:
  # Client connection ports
  workProccesStartPort: 1560
  workProccesEndPort: 1591
  # Cluster manager port
  clusterManagerPort: 1541
  # Server agent port (optional in case single cluster server)
  serverAgent: 1540
  # RAS port
  rasPort: 1545

## Storage parameters
storage:
  ## Set persistentVolumenClaimName to reference an existing PVC
  persistentVolumeClaimName:
  ## Internal volume name and prefix of a created PVC
  volumeName: "usr1cv8"
  ## Alternative set requestedSize to define a size for a dynmaically created PVC
  requestedSize:
  ## the storage class name
  className:
  ## Default access mode (ReadWriteOnce)
  accessModes:
    - ReadWriteOnce
  ## Additional storage annotations
  annotations: {}
  ## Additional storage labels
  labels: {}

# Access to host machine's hasp keys
useHasp: false

serviceAccount: 
  create: true
